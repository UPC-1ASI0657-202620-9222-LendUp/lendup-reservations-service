services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lendup_reservas
      MYSQL_USER: ${DB_USERNAME:-lendup_reservas}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      TZ: UTC
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-lendup_reservas}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  reservations:
    platform: linux/amd64
    build:
      context: .
      platforms: ["linux/amd64"]
    env_file: .env
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/lendup_reservas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      RABBITMQ_HOST: rabbitmq
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      SPRINGDOC_ENABLED: "false"
      SWAGGER_PUBLIC: "false"
    ports: ["${SERVER_PORT:-8081}:8081"]
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH:?FIREBASE_CREDENTIALS_HOST_PATH required}:/run/secrets/firebase-service-account.json:ro
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
volumes:
  mysql-data:
  rabbitmq-data:
